# Netlify configuration for DCII Demos

[build]
  publish = "/"

# Force HTTPS redirect
[[redirects]]
  from = "http://demos.sixtydeucedesign.com/*"
  to = "https://demos.sixtydeucedesign.com/:splat"
  status = 301
  force = true

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "upgrade-insecure-requests"

# Cache static assets
[[headers]]
  for = "/*/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty URLs - serve index.html for directory requests
[[redirects]]
  from = "/oak-and-iron-barber"
  to = "/t1-starter/d3-oak-and-iron-barber/oak-and-iron-barber.html"
  status = 301

[[redirects]]
  from = "/clearview-window-cleaning"
  to = "/t1-starter/d4-clearview-window-cleaning/clearview-window-cleaning.html"
  status = 301

[[redirects]]
  from = "/peakstone-roofing"
  to = "/t2-business/d1-peakstone-roofing/peakstone-roofing.html"
  status = 301

[[redirects]]
  from = "/frostline-hvac"
  to = "/t2-business/d2-frostline-hvac/frostline-hvac.html"
  status = 301

[[redirects]]
  from = "/verde-valley-landscaping"
  to = "/t3-professional/d5-verde-valley-landscaping/verde-valley-landscaping.html"
  status = 301
